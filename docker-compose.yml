version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: fxtrade
      POSTGRES_PASSWORD: fxtrade
      POSTGRES_DB: fxtrade
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fxtrade"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://fxtrade:fxtrade@db:5432/fxtrade
      DATABASE_URL_SYNC: postgresql://fxtrade:fxtrade@db:5432/fxtrade
      APP_ENV: production
      DEBUG: "false"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data

volumes:
  postgres_data:
