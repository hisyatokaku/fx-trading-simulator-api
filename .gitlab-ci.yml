stages:
  - test
  - build
  - deploy
  - seed

variables:
  POSTGRES_DB: fxtrade
  POSTGRES_USER: fxtrade
  POSTGRES_PASSWORD: fxtrade
  DATABASE_URL: "postgresql+asyncpg://fxtrade:fxtrade@postgres:5432/fxtrade"
  DATABASE_URL_SYNC: "postgresql://fxtrade:fxtrade@postgres:5432/fxtrade"

# ── Test ─────────────────────────────────────────────────────────────────────

test:
  stage: test
  image: python:3.12-slim
  services:
    - name: postgres:15
      alias: postgres
  before_script:
    - pip install -r requirements.txt
    - alembic upgrade head
  script:
    - pytest tests/ -v --tb=short
  coverage: '/TOTAL.*\s+(\d+%)$/'

# ── Build Docker image ────────────────────────────────────────────────────────

build:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  variables:
    IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t $IMAGE .
    - docker push $IMAGE
  only:
    - main
    - tags

# ── Deploy to Railway ──────────────────────────────────────────────────────────

deploy:
  stage: deploy
  image: node:20-slim
  environment:
    name: production
    url: https://app-production-7488.up.railway.app
  script:
    - npx --yes @railway/cli up --service app --environment production --project $RAILWAY_PROJECT_ID -c --yes -m "CI deploy $CI_COMMIT_SHORT_SHA"
  when: manual
  only:
    - main

# ── Seed / upsert traders.csv & rates.csv into production ──────────────────────

seed_data:
  stage: seed
  image: python:3.12-slim
  variables:
    API_BASE_URL: https://app-production-7488.up.railway.app
  before_script:
    - pip install httpx
  script:
    - python scripts/seed_data.py
  when: manual
  only:
    - main
